<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro do Bar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Inknut Antiqua', serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            width: 150px;
            height: 150px;
            background: #ccc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        h1 {
            font-size: 2.3rem;
            font-weight: 400;
            text-align: center;
            margin-bottom: 30px;
        }
        .info-label {
            width: 100%;
            text-align: left;
            font-size: 1rem;
            margin-bottom: 10px;
            margin-top: 10px;
            font-family: Arial, sans-serif;
            font-weight: 400;
        }
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 25px;
            border: none;
            font-size: 1rem;
            background: #fff;
            color: #222;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }
        .btn-cadastrar {
            width: 60%;
            margin: 30px auto 0 auto;
            padding: 12px 0;
            border-radius: 25px;
            border: none;
            background: #23b7d9;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-cadastrar:hover {
            background: #199ab3;
        }
        footer {
            background: #181818;
            color: #fff;
            padding: 18px 0 8px 0;
            font-size: 0.9rem;
            margin-top: 60px;
        }
        .footer-content {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .footer-links {
            margin-top: 8px;
            margin-bottom: 8px;
        }
        .footer-links a {
            color: #fff;
            text-decoration: underline;
            margin: 0 10px;
        }
        .footer-links a:hover {
            color: #23b7d9;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="logo">
            <img src="../../Imagens/Bebidas_não_alcoólicas/logo_semfundo.png" alt="Logo do Bar">
        </div>

        <h1>Cadastro Do Bar</h1>

        <div class="info-label">Informações sobre o local</div>

        <!-- FORMULÁRIO COM ID CORRETO -->
        <form id="cadastroBarForm">

            <input id="nome" type="text" placeholder="Nome do bar" required>
            <input id="email" type="email" placeholder="E-mail" required>
            <input id="cep" type="text" placeholder="CEP" required>
            <input id="telefone" type="tel" placeholder="Telefone" required>
            <input id="tipo" type="text" placeholder="Tipo de bar" required>
            <input id="senha" type="password" placeholder="Senha" required>

            <button type="submit" class="btn-cadastrar">Cadastrar</button>

            <!-- MENSAGEM DE SUCESSO OU ERRO -->
            <p id="mensagem" style="display:none; text-align:center; margin-top:10px; font-family:Arial;"></p>
        </form>
    </div>

    <footer>
        <div class="footer-content">
            <div style="font-size:0.85rem;">©2025 SubZero. Todos os direitos reservados<br>Beba com moderação.</div>

            <div class="footer-links">
                <a href="../Politicas_de_Privacidade_italo/politicas.html">Política de Privacidade</a>
                <a href="../Termos_Italo/termos.html">Termos de Uso</a>
                <a href="../Faq_Italo/faq.html">FAQ</a>
                <a href="../SUPORTE_CONTATO_ITALO/suporte_contato.html">Contato</a>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('cadastroBarForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const cep = document.getElementById('cep').value.trim();
            const tipo = document.getElementById('tipo').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const mensagem = document.getElementById('mensagem');

            if (!nome || !email || !cep || !tipo || !senha) {
                mensagem.textContent = "Preencha todos os campos!";
                mensagem.style.color = "#ff5555";
                mensagem.style.display = "block";
                return;
            }

            mensagem.textContent = "Cadastro realizado com sucesso!";
            mensagem.style.color = "#23b7d9";
            mensagem.style.display = "block";

            setTimeout(() => {
                mensagem.style.display = "none";
                document.getElementById('cadastroBarForm').reset();

                // 🔵 REDIRECIONAMENTO APÓS O SUCESSO
               window.location.href = "../../VIEWS/Home_Italo/home.html";


            }, 2000);
        });
    </script>

</body>
</html>
