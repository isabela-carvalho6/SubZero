<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Idade - DevPub</title>
    <link rel="stylesheet" href="entrada.css">
    <link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      .logo-container {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 100;
      }
      .logo-container a {
        display: inline-block;
        transition: transform 0.3s ease;
      }
      .logo-container a:hover {
        transform: scale(1.1);
      }
      .logo-container img {
        height: 80px;
        width: auto;
        object-fit: contain;
      }
    </style>
</head>
<body>
    <div class="logo-container">
      <a href="/SubZero/views/Home_Italo/home.html"><img src="/SubZero/Imagens/logo.png" alt="Logo"></a>
    </div>
    <main class="container">
        <div class="overlay">
            <h1>Nos diga sua data de nascimento, só pra<br> garantir que você já pode curtir com a gente!</h1>

            <div class="inputs">
                <input type="text" id="dia" maxlength="2" placeholder="DD">
                <input type="text" id="mes" maxlength="2" placeholder="MM">
                <input type="text" id="ano" maxlength="4" placeholder="AAAA">
            </div>

            <button id="btnEntrar" class="btn" type="button">ENTRE
              <a href="../Home_Italo/home.html"></a>
            </button>

            <p class="moderacao">BEBA COM MODERAÇÃO.</p>
        </div>
    </main>

    <footer>
        <p>&copy; SubZero 2025. Todos os direitos reservados</p>
        <p>Beba com moderação.</p>
        <p>
            <a href="../Politicas_de_Privacidade_italo/politicas.html">Política de Privacidade</a> |
            <a href="../Termos_Italo/termos.html">Termos de Uso</a> |
            <a href="../Faq_Italo/faq.html">FAQ</a> |
            <a href="../Suporte_Contato_Italo/suporte_contato.html">Contato</a>
        </p>
    </footer>

    <script src="entrada.js"></script>

    
</body>
</html>
