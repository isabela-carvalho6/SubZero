<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil Profissional</title>
  <link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@100;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Perfil.css">
</head>
<body>

  <div class="topbar">
    <ul>
      <li><a href="#" onclick="Inicio(event)">Início</a></li>
      <li><a href="#" onclick="Colaboradores(event)">Colaboradores</a></li>
      <li><a href="#" onclick="Contato(event)">Contato</a></li>
      <li><a href="#" onclick="Sair(event)">Sair</a></li>
    </ul>
  </div>

  <h1>Perfil Profissional</h1>
  <label for="profile-upload" class="drink" title="Clique para alterar a foto">
    <img src="foto-usuario.jpg" alt="Foto de perfil" />
    <span class="name">Alterar Foto</span>
    <input type="file" id="profile-upload" accept="image/*" style="display: none;" />
  </label>

<div class="gallery-section">
  <h2>Habilidades</h2>
  <div class="gallery-cards">
    <div class="skill-card">
      <h3><strong>Habilidade 1</strong></h3>
      <p contenteditable="true">Descreva sua habilidade aqui</p>
    </div>
    <div class="skill-card">
      <h3><strong>Habilidade 2</strong></h3>
      <p contenteditable="true">Descreva sua habilidade aqui</p>
    </div>
    <div class="skill-card">
      <h3><strong>Habilidade 3</strong></h3>
      <p contenteditable="true">Descreva sua habilidade aqui</p>
    </div>
  </div>
</div>

<div class="gallery-section">
  <h2>Projetos</h2>
  <div class="gallery-cards">
    <div class="skill-card">
      <h3><strong>Projeto 1</strong></h3>
      <p contenteditable="true">Descreva seu projeto aqui</p>
    </div>
    <div class="skill-card">
      <h3><strong>Projeto 2</strong></h3>
      <p contenteditable="true">Descreva seu projeto aqui</p>
    </div>
  </div>
</div>

  <script>
    const profileUpload = document.getElementById('profile-upload');
    const profileImage = document.querySelector('.drink img');

    profileUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      const reader = new FileReader();

      reader.onload = (e) => {
        profileImage.src = e.target.result;
      };

      reader.readAsDataURL(file);
    });

    function Sair(event) {
      event.preventDefault();
      window.location.href = '../Bem_vindo_de_volta_Isabela/Bemvindodevolta.html';
    }

    function Contato(event) {
      event.preventDefault();
      window.location.href = '../SUPORTE_CONTATO_ITALO/suporte_contato.html';
    }

     function Inicio(event) {
      event.preventDefault();
      window.location.href = '../Home_Italo/home.html';
    }

    function Colaboradores(event) {
      event.preventDefault();
      window.location.href = '../Colaboradores_Isabela/Colaboradores.html';
    }
  </script>
</body>
</html>
