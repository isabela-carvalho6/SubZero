<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login DevPub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@100;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Bemvindodevolta.css" />
  <style>
    .logo-container {
      text-align: center;
      padding: 20px 0;
      margin-bottom: 30px;
    }
    .logo-container a {
      display: inline-block;
      transition: transform 0.3s ease;
    }
    .logo-container a:hover {
      transform: scale(1.1);
    }
    .logo-container img {
      height: 100px;
      width: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <a href="/SubZero/views/Home_Italo/home.html"><img src="/SubZero/Imagens/logo.png" alt="Logo"></a>
  </div>

  <div class="welcome">BEM-VINDO(A) DE VOLTA!</div>

  <form class="login-container" onsubmit="return handleLogin(event)">
    <div class="form-group">
      <label for="username">Nome de Usuário</label>
      <input type="text" id="username" required />
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" required />
    </div>

    <button type="submit" class="login-btn">CONFIRMAR</button>
  <div class="forgot-password">
    <a href="../Recuperar_senha_Isabela/Recuperarsenha.html">Esqueci minha senha</a>
  </div>
</form>

<script>
  function handleLogin(event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (username && password) {
      window.location.href = "../Sobre_a_equipe_Isabela/Sobreaequipe.html";
    }
  }
  </script>
</body>
</html>
