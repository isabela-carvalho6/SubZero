<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro Concluído</title>
  <link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="Cadastroconcluido.css" />
</head>
<body>
  <style>
    .logo-container {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 100;
    }
    .logo-container a {
        display: inline-block;
        transition: transform 0.3s ease;
    }
    .logo-container a:hover {
        transform: scale(1.1);
    }
    .logo-container img {
        height: 80px;
        width: auto;
        object-fit: contain;
    }
  </style>
  <div class="logo-container">
    <a href="/SubZero/views/Home_Italo/home.html"><img src="/SubZero/Imagens/logo.png" alt="Logo"></a>
  </div>
  <div class="message-box">
    <h1>Cadastro concluído com sucesso!</h1>
    <p>Obrigado por se cadastrar. Agora você pode acessar sua conta.</p>
  </div>
  
  <script>
    setTimeout(function() {
      window.location.href = '../Perfil_Isabela/Perfil.html';
    }, 3000); 
  </script>
</body>
</html>
